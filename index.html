<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินการอบรมออนไลน์ - Nurse Smart Exam</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%); min-height: 100vh; }
        
        /* Glassmorphism Effect */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        
        .active-glow {
            animation: pulseGlow 2s infinite;
            border-color: #38bdf8;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        /* ซ่อนหน้าจอที่ไม่ได้ใช้งาน */
        .hidden-view { display: none !important; }
    </style>
</head>
<body class="flex flex-col text-gray-800">

    <header class="w-full p-4 glass-panel sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="p-2 bg-sky-500 text-white rounded-xl shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
            </div>
            <div>
                <h1 class="text-lg font-bold text-sky-800 leading-tight">NURSE-ED EVALUATION</h1>
                <p class="text-xs text-sky-600">ระบบคลังข้อสอบออนไลน์เรียลไทม์</p>
            </div>
        </div>
        <div id="userInfo" class="hidden-view text-right">
            <p id="userNameDisplay" class="text-sm font-bold text-sky-700"></p>
            <button onclick="logout()" class="text-xs text-red-500 hover:underline">ออกจากระบบ</button>
        </div>
    </header>

    <main class="flex-grow container mx-auto px-4 py-8 relative">
        
        <div id="loaderView" class="flex flex-col items-center justify-center h-64">
            <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-sky-500 mb-4"></div>
            <p class="text-sky-700 font-semibold animate-pulse">กำลังโหลดข้อมูลระบบ...</p>
        </div>

        <div id="loginView" class="hidden-view max-w-md mx-auto glass-panel p-8 rounded-3xl animate__animated animate__zoomIn">
            <h2 class="text-2xl font-bold text-center text-sky-800 mb-6">ลงทะเบียนเข้าสอบ</h2>
            <div class="space-y-4">
                <input type="tel" id="inpPhone" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-sky-400 outline-none" placeholder="เบอร์โทรศัพท์ (ใช้เข้าระบบซ้ำ)">
                <input type="text" id="inpName" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-sky-400 outline-none" placeholder="ชื่อ - นามสกุล">
                <input type="text" id="inpPos" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-sky-400 outline-none" placeholder="ตำแหน่ง (เช่น พยาบาลวิชาชีพ)">
                <input type="text" id="inpDept" class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-sky-400 outline-none" placeholder="หน่วยงาน/ตึก">
                <button onclick="handleLogin()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 rounded-xl shadow-lg transition transform hover:-translate-y-1">
                    เข้าสู่ระบบ 🚀
                </button>
            </div>
        </div>

        <div id="dashboardView" class="hidden-view animate__animated animate__fadeIn">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-gray-800">คลังข้อสอบของคุณ</h2>
                <button onclick="fetchData()" class="text-sm bg-white border border-gray-300 px-3 py-1 rounded-lg hover:bg-gray-50">🔄 รีเฟรชข้อมูล</button>
            </div>
            <div id="quizGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4"></div>
        </div>

        <div id="quizView" class="hidden-view max-w-3xl mx-auto animate__animated animate__fadeInRight">
            <div class="glass-panel p-6 rounded-2xl mb-4 flex justify-between items-center border-l-4 border-sky-500">
                <h2 id="quizTitle" class="text-xl font-bold text-sky-800">ชุดข้อสอบที่ X</h2>
                <div class="text-right">
                    <p class="text-xs text-gray-500">เวลาที่ใช้</p>
                    <p id="timerDisplay" class="text-lg font-mono font-bold text-red-500">00:00</p>
                </div>
            </div>
            <div id="questionContainer" class="space-y-6 mb-8">
                </div>
            <button onclick="submitQuiz()" class="w-full bg-green-500 hover:bg-green-600 text-white text-lg font-bold py-4 rounded-xl shadow-lg transition">
                ส่งคำตอบ ✅
            </button>
        </div>

    </main>

    <footer class="text-center p-4 text-xs text-gray-500 mt-auto">
        © 2026 Nurse-Ed System | 
        <button onclick="openAdminLogin()" class="hover:text-sky-500 underline">สำหรับวิทยากร</button>
    </footer>

    <script>
        // URL ของ Google Apps Script ที่คุณให้มา
        const API_URL = "https://script.google.com/macros/s/AKfycbwP_S-ABl42AFfSdOmQFX_rLHEMvK3hrBFbLgTvswP8SWuEAxQezOyotmoReN3r69N5Uw/exec";
        
        let currentUser = null;
        let allQuestions = [];
        let quizStatus = {};
        let mySubmissions = [];
        
        let currentSet = 0;
        let startTime = 0;
        let timerInterval;

        // เมื่อหน้าเว็บโหลดเสร็จ
        document.addEventListener("DOMContentLoaded", () => {
            checkLocalUser();
            fetchData();
        });

        // 1. ตรวจสอบการล็อกอินจาก Local Storage
        function checkLocalUser() {
            const saved = localStorage.getItem("nurse_exam_user");
            if (saved) {
                currentUser = JSON.parse(saved);
                document.getElementById("userNameDisplay").innerText = `${currentUser.name} (${currentUser.department})`;
                document.getElementById("userInfo").classList.remove("hidden-view");
            }
        }

        // 2. ดึงข้อมูลข้อสอบและสถานะจาก Google Sheets
        async function fetchData() {
            showView("loaderView");
            try {
                // ดึงคำถาม
                let resQ = await fetch(`${API_URL}?action=get_questions`);
                let dataQ = await resQ.json();
                allQuestions = dataQ.data;

                // ดึงสถานะและคะแนน
                let resS = await fetch(`${API_URL}?action=get_status_and_leaderboard`);
                let dataS = await resS.json();
                quizStatus = dataS.quizStatus;
                
                if (currentUser) {
                    // กรองเฉพาะประวัติการสอบของตัวเอง
                    mySubmissions = dataS.submissions.filter(s => s.user_id === currentUser.phone);
                    renderDashboard();
                } else {
                    showView("loginView");
                }
            } catch (err) {
                Swal.fire("ข้อผิดพลาด", "ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณารีเฟรชหน้าเว็บ", "error");
            }
        }

        // 3. ระบบล็อกอิน
        async function handleLogin() {
            const phone = document.getElementById("inpPhone").value.trim();
            const name = document.getElementById("inpName").value.trim();
            const pos = document.getElementById("inpPos").value.trim();
            const dept = document.getElementById("inpDept").value.trim();

            if (!phone || !name) return Swal.fire("แจ้งเตือน", "กรุณากรอกเบอร์โทรศัพท์และชื่อ", "warning");

            Swal.fire({ title: 'กำลังเข้าสู่ระบบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            const payload = { action: "login", phone, name, position: pos, department: dept };
            
            try {
                let res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                let data = await res.json();
                
                if (data.status === "success") {
                    currentUser = data.isNew ? payload : data.user;
                    localStorage.setItem("nurse_exam_user", JSON.stringify(currentUser));
                    
                    Swal.close();
                    document.getElementById("userNameDisplay").innerText = `${currentUser.name} (${currentUser.department})`;
                    document.getElementById("userInfo").classList.remove("hidden-view");
                    fetchData(); // โหลดข้อมูลใหม่เพื่อแสดง Dashboard
                }
            } catch (err) {
                Swal.fire("ข้อผิดพลาด", "การเชื่อมต่อล้มเหลว", "error");
            }
        }

        // 4. วาดหน้าต่าง Dashboard
        function renderDashboard() {
            const grid = document.getElementById("quizGrid");
            grid.innerHTML = "";

            for (let i = 1; i <= 10; i++) {
                let isOpen = quizStatus[i] === true;
                let isDone = mySubmissions.find(s => s.set_number === i);
                
                let cardClass = "glass-panel p-5 rounded-2xl flex flex-col items-center text-center transition transform";
                let icon, titleColor, btnHtml;

                if (isDone) {
                    cardClass += " opacity-90 border-green-200";
                    icon = "✅";
                    titleColor = "text-green-700";
                    btnHtml = `<div class="mt-4 text-sm font-bold text-green-600 bg-green-100 py-2 px-4 rounded-xl w-full">ได้คะแนน ${isDone.score} คะแนน</div>`;
                } else if (isOpen) {
                    cardClass += " hover:-translate-y-2 hover:shadow-xl active-glow cursor-pointer";
                    icon = "📝";
                    titleColor = "text-sky-800";
                    btnHtml = `<button onclick="startQuiz(${i})" class="mt-4 w-full bg-gradient-to-r from-sky-400 to-blue-500 text-white font-bold py-2 rounded-xl shadow">เริ่มทำข้อสอบ</button>`;
                } else {
                    cardClass += " opacity-60 bg-gray-50";
                    icon = "🔒";
                    titleColor = "text-gray-500";
                    btnHtml = `<button disabled class="mt-4 w-full bg-gray-200 text-gray-500 font-bold py-2 rounded-xl">รอวิทยากรเปิด</button>`;
                }

                grid.innerHTML += `
                    <div class="${cardClass}">
                        <div class="text-4xl mb-2">${icon}</div>
                        <h3 class="font-bold ${titleColor} text-lg">ชุดที่ ${i}</h3>
                        <p class="text-xs text-gray-500">5 ข้อ (5 คะแนน)</p>
                        ${btnHtml}
                    </div>
                `;
            }
            showView("dashboardView");
        }

        // 5. เริ่มทำข้อสอบ
        function startQuiz(setNum) {
            currentSet = setNum;
            const container = document.getElementById("questionContainer");
            container.innerHTML = "";
            document.getElementById("quizTitle").innerText = `กำลังทำชุดข้อสอบที่ ${setNum}`;

            // ดึงข้อสอบเฉพาะชุดนี้
            let questions = allQuestions.filter(q => q.set_number === setNum);
            
            if(questions.length === 0) {
                return Swal.fire("แจ้งเตือน", "ยังไม่มีข้อมูลข้อสอบในระบบ", "warning");
            }

            questions.forEach((q, index) => {
                let optionsHtml = q.choices.map((choice, cIndex) => {
                    let letter = ['ก', 'ข', 'ค', 'ง'][cIndex];
                    return `
                    <label class="flex items-start p-3 bg-white border border-sky-100 rounded-xl cursor-pointer hover:bg-sky-50 transition">
                        <input type="radio" name="q_${q.question_no}" value="${letter}" class="mt-1 mr-3 w-4 h-4 text-sky-500 focus:ring-sky-400">
                        <span class="text-sm text-gray-700 leading-relaxed">${choice}</span>
                    </label>`;
                }).join('');

                container.innerHTML += `
                    <div class="bg-white/60 p-5 rounded-2xl border border-white shadow-sm">
                        <h4 class="font-bold text-gray-800 mb-3">${index + 1}. ${q.question_text}</h4>
                        <div class="space-y-2">${optionsHtml}</div>
                    </div>
                `;
            });

            showView("quizView");
            
            // เริ่มจับเวลา
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        }

        // 6. อัปเดตเวลาบนหน้าจอ
        function updateTimer() {
            let diff = Math.floor((Date.now() - startTime) / 1000);
            let m = Math.floor(diff / 60).toString().padStart(2, '0');
            let s = (diff % 60).toString().padStart(2, '0');
            document.getElementById("timerDisplay").innerText = `${m}:${s}`;
        }

        // 7. ส่งข้อสอบ
        async function submitQuiz() {
            let questions = allQuestions.filter(q => q.set_number === currentSet);
            let score = 0;
            let answeredAll = true;

            // ตรวจคำตอบ
            questions.forEach(q => {
                let selected = document.querySelector(`input[name="q_${q.question_no}"]:checked`);
                if (!selected) answeredAll = false;
                else if (selected.value === q.answer) score++;
            });

            if (!answeredAll) {
                return Swal.fire("ยังทำไม่ครบ", "กรุณาตอบคำถามให้ครบทุกข้อก่อนส่งครับ", "warning");
            }

            clearInterval(timerInterval);
            let timeUsed = Math.floor((Date.now() - startTime) / 1000);

            Swal.fire({ title: 'กำลังตรวจข้อสอบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // ส่งคะแนนไปเซฟ
            const payload = {
                action: "submit_score",
                phone: currentUser.phone,
                set_number: currentSet,
                score: score,
                time_used: timeUsed
            };

            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                Swal.fire({
                    title: 'ยอดเยี่ยม!',
                    text: `คุณได้ ${score} / ${questions.length} คะแนน\nใช้เวลาไป ${timeUsed} วินาที`,
                    icon: 'success',
                    confirmButtonText: 'กลับไปหน้าหลัก',
                    confirmButtonColor: '#0ea5e9'
                }).then(() => {
                    fetchData(); // โหลดข้อมูลใหม่เพื่ออัปเดตหน้า Dashboard
                });
            } catch (err) {
                Swal.fire("ข้อผิดพลาด", "ส่งคำตอบไม่สำเร็จ กรุณาลองใหม่", "error");
            }
        }

        // 8. ป็อปอัปวิทยากร (Admin Login)
        function openAdminLogin() {
            Swal.fire({
                title: 'รหัสผ่านวิทยากร',
                input: 'password',
                inputAttributes: { autocapitalize: 'off' },
                showCancelButton: true,
                confirmButtonText: 'เข้าสู่ระบบ',
                cancelButtonText: 'ยกเลิก',
                confirmButtonColor: '#0ea5e9'
            }).then((result) => {
                if (result.value === '0000') {
                    // ถ้ารหัสผ่านถูก จะเปิดหน้าต่างแผงควบคุมวิทยากร
                    // Note: ฟีเจอร์ Admin Dashboard สามารถเขียนเสริมต่อจากตรงนี้ได้
                    Swal.fire("ยินดีต้อนรับ", "เข้าสู่โหมดวิทยากรสำเร็จ", "success");
                } else if (result.value) {
                    Swal.fire("รหัสผ่านผิด", "", "error");
                }
            });
        }

        // Utility: ออกจากระบบ
        function logout() {
            localStorage.removeItem("nurse_exam_user");
            location.reload();
        }

        // Utility: สลับหน้าจอ
        function showView(viewId) {
            ['loaderView', 'loginView', 'dashboardView', 'quizView'].forEach(id => {
                document.getElementById(id).classList.add("hidden-view");
            });
            document.getElementById(viewId).classList.remove("hidden-view");
        }
    </script>
</body>
</html>
